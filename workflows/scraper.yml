name: Daily Tender Scraper to JSON

on:
  schedule:
    - cron: '0 0 * * *' # 每天早上 8:00 (HKT) 自動爬取
  workflow_dispatch:     # 支援手動觸發

permissions:
  contents: write       # 賦予 Actions 寫入 Repo 的權限

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Scraper Script
        run: python scrapers/main_scraper.py

      - name: Commit & Push JSON Update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update tenders.json [skip ci]"
          file_pattern: 'data/tenders.json'
