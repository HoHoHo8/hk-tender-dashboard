name: Auto Run Tender Scraper

on:
  schedule:
    # 每天 UTC 00:00 (香港時間 08:00) 自動執行一次
    - cron: '0 0 * * *'
  workflow_dispatch: # 允許在 GitHub 頁面上手動觸發

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 關鍵步驟：安裝 Playwright 的 Chromium 瀏覽器與 Linux 系統依賴庫
    - name: Install Playwright Browsers
      run: |
        playwright install chromium --with-deps

    - name: Run Scraper Script
      run: |
        python main_scraper.py

    - name: Commit and Push updated data
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data/
        git diff-index --quiet HEAD || git commit -m "chore: auto-update tenders.json [skip ci]"
        git push
