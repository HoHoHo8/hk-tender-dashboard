<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <title>香港招標資訊追蹤 Dashboard</title>
  <!-- FullCalendar CDN -->
  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; }
    
    /* 頂部 Header */
    header { background: #fff; padding: 15px 30px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 20px; color: #333; }
    
    /* 主要雙欄布局 Container */
    .app-container { display: flex; height: calc(100vh - 65px); padding: 20px; gap: 20px; }
    
    /* 左側 Sidebar */
    .sidebar { width: 320px; background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow-y: auto; }
    .sidebar h2 { font-size: 16px; margin-bottom: 15px; color: #444; border-bottom: 2px solid #007bff; padding-bottom: 5px; }
    .tender-item { padding: 10px; border-bottom: 1px solid #eee; font-size: 13px; }
    .tender-item:hover { background: #f8f9fa; cursor: pointer; }
    .tender-date { color: #888; font-size: 12px; margin-top: 4px; }
    
    /* 右側 Calendar 主區塊 */
    .main-content { flex: 1; background: #fff; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow: hidden; }
    #calendar { height: 100%; }
  </style>
</head>
<body>

  <header>
    <h1>🏛️ 香港招標資訊追蹤 Dashboard</h1>
    <span id="update-time" style="font-size: 12px; color: #666;">即時數據</span>
  </header>

  <div class="app-container">
    <!-- 左側 Sidebar -->
    <aside class="sidebar">
      <h2>最新截標項目</h2>
      <div id="tender-list">載入中...</div>
    </aside>

    <!-- 右側 月曆 -->
    <main class="main-content">
      <div id="calendar"></div>
    </main>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var calendarEl = document.getElementById('calendar');
      var listEl = document.getElementById('tender-list');

      var calendar = new FullCalendar.Calendar(calendarEl, {
        initialView: 'dayGridMonth',
        locale: 'zh-tw',
        headerToolbar: {
          left: 'prev,next today',
          center: 'title',
          right: 'dayGridMonth,listWeek'
        },
        events: 'data/tenders.json' // 自動讀取 data/tenders.json
      });
      calendar.render();

      // 同步動態載入 Sidebar 列表
      fetch('data/tenders.json')
        .then(response => response.json())
        .then(data => {
          listEl.innerHTML = '';
          if (data.length === 0) {
            listEl.innerHTML = '<p style="color:#888;">暫無招標資料</p>';
            return;
          }
          data.forEach(item => {
            var div = document.createElement('div');
            div.className = 'tender-item';
            div.innerHTML = `<strong>${item.title}</strong><div class="tender-date">截標日期: ${item.date}</div>`;
            div.onclick = () => alert(`招標編號: ${item.code}\n項目: ${item.title}\n截標日期: ${item.date}`);
            listEl.appendChild(div);
          });
        })
        .catch(err => {
          listEl.innerHTML = '<p style="color:red;">載入失敗</p>';
        });
    });
  </script>
</body>
</html>
